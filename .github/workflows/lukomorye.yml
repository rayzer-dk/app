name: Lukomorye PWA build and tests
on:
  push:
    paths:
      - 'lukomorye/**'
      - 'Lukomorye_Server_v1.8.2.zip'
      - '.github/workflows/lukomorye.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lukomorye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Install source parser
        run: python3 -m pip install beautifulsoup4==4.14.3 --break-system-packages
      - name: Restore and verify source
        run: npm run prepare:source
      - name: Bundle server and autonomous versions
        run: npm run build
      - name: Vitest library integrity
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright mobile, desktop and offline tests
        run: npm run test:browser
      - name: Create archives
        run: |
          python3 -c "import shutil; shutil.make_archive('dist/Lukomorye_Server_v1.12.0','zip','dist/server'); shutil.make_archive('dist/Lukomorye_Autonomous_v1.12.0','zip','dist/offline')"
      - uses: actions/upload-artifact@v4
        with:
          name: Lukomorye-v1.12.0
          path: |
            lukomorye/dist/Lukomorye_Server_v1.12.0.zip
            lukomorye/dist/Lukomorye_Autonomous_v1.12.0.zip
            lukomorye/dist/integrity.json
            lukomorye/package-lock.json
            lukomorye/dist/visual/*.png
          if-no-files-found: error
